{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'main/images/trecefavicon2.png' %}">
    <title>{% block title %}Aventura Ecuestre - Rutas a caballo en Tarifa{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Excursiones y rutas a caballo en Tarifa, Cádiz. Paseos ecuestres por playa y montaña con guías profesionales.{% endblock %}">

    <link rel="stylesheet" href="{% static 'main/css/output.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <meta property="og:title" content="{% block og_title %}Aventura Ecuestre - Rutas a Caballo en Tarifa{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Excursiones a caballo por Tarifa, Cádiz{% endblock %}">
    <meta property="og:image" content="{% block og_image %}https://aventuraecuestre.com{% static 'main/images/atardecer.jpg' %}{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{% block og_url %}https://aventuraecuestre.com{% endblock %}">

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "TouristAttraction",
            "name": "Aventura Ecuestre",
            "description": "Excursiones y rutas a caballo en Tarifa, Cádiz",
            "image": "https://aventuraecuestre.com{% static 'main/images/hero-image.jpg' %}",
            "url": "https://aventuraecuestre.com",
            "telephone": "+34626480019",
            "address": {
            "@type": "PostalAddress",
            "streetAddress": "Carretera N-340 km 78 Frente al Camping Tarifa",
            "addressLocality": "Tarifa",
            "addressRegion": "Cádiz",
            "postalCode": "11380",
            "addressCountry": "ES"
        },
        "geo": {
            "@type": "GeoCoordinates",
            "latitude": "36.056233",
            "longitude": "-5.647469"
        },
        "openingHours": "Mo-Su 09:00-18:00"
        }
    </script>
    <link rel="canonical" href="{% block canonical %}https://aventuraecuestre.com{% endblock %}">
</head>
<body class="bg-(--color-dark)">
    <!-- Header -->
    <header>
        {% include 'main/partials/header.html' %}
    </header>
   
    <!-- Main Content -->
    <main class="
        w-full
        {% block main_class %}bg-(--color-cal){% endblock %}
        overflow-hidden"
         >
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center">
        {% include 'main/partials/footer.html' %}
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="{% static 'main/js/main.js' %}"></script>
    
    <!-- WhatsApp Float Button -->

    <a    
        href="https://wa.me/34626480019"
        target="_blank"
        rel="noopener noreferrer"
        class="fixed bottom-6 right-6 z-50 flex items-center justify-center w-14 h-14 lg:w-30 lg:h-30 rounded-full shadow-lg bg-[#25D366] hover:bg-[#1ebe5d] transition-colors duration-200"
        aria-label="Contactar por WhatsApp"
    >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" class="w-7 h-7 lg:w-20 lg:h-20">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
            <path d="M12 0C5.373 0 0 5.373 0 12c0 2.117.549 4.107 1.51 5.84L.057 23.428a.75.75 0 0 0 .916.916l5.588-1.453A11.95 11.95 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.703 9.703 0 0 1-4.953-1.356l-.355-.211-3.676.956.976-3.566-.23-.368A9.71 9.71 0 0 1 2.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/>
        </svg>
    </a>
</body>
</html>
