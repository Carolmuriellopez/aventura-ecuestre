{% load static %}
<article class="
    border border-transparent
    rounded-xl
    overflow-hidden
    bg-white
    mb-5                  
    ">
    <img src="{% static 'main/images/atardecer.jpg' %}" 
        alt="Jinete y caballo al atardecer" 
        class="
        h-80
        object-cover 
        w-full
        mb-4
        
        md:h-120">
    <div class="p-5">
        <div class="flex justify-between items-center">
            <h3 class="
                font-titan font-bold
                text-(--color-tierra) text-4xl
                mb-5
                inline-block

                md:mb-10
                ">Relax Holidays
            </h3>
        </div>
        <p class="
            text-(--color-trece) 
            mb-4

            md:text-xl

        <hr class="border-(--color-trece) mb-4 md:mb-10">

            <div class="flex justify-start">
                <div class="w-2 h-2 rounded-full bg-(--color-poniente) mt-[0.5rem] mr-2"></div>

                    font-titan 
                    font-bold

                    10 horas en 5 días
                </span>
            </div>
            <p class="
                font-titan
                font-bold 
                
                md:text-xl">
                600€<span class="
                    text-(--color-trece) 
                    text-xs 
                    font-titan 
                    font-bold
                    
                    md:text-lg">/persona</span>
            </p>
        </div>
        <a href="{% url 'contact' %}" class="
            font-titan
            font-bold
            text-white
            border
            bg-(--color-luz)
            rounded-xl
            p-5
            block
            w-fit
            mx-auto

            md:text-xl
            ">RESERVAR EXPERIENCIA
        </a>
    </div>
</article>
