{% load static %}
<article class="
    border border-transparent
    rounded-xl
    overflow-hidden
    bg-white
    h-full flex flex-col
    ">
    <img src="{% static 'main/images/aventura_ecuestre_hero.jpg' %}" 
        alt="Caballos paseando por la playa" 
        class="
        h-80
        object-cover 
        w-full
        mb-4
        
        md:h-120">
    <div class="p-5 flex flex-col grow">
        <div class="flex justify-between items-center">
            <h3 class="
                font-titan font-bold
                text-(--color-tierra) text-4xl md:text-fluid-title
                mb-5
                inline-block

                md:mb-10
                ">Punta Paloma
            </h3>
        </div>
        <p class="
            text-(--color-trece)
            mb-4

            md:text-fluid-body
            md:mb-10
            ">Cruzamos la playa de Valdevaqueros hasta bordear la preciosa Duna de Punta Paloma por la costa. Mágica y maravillosa.
        </p>
        <div class="footer-article mt-auto">
            <hr class="border-(--color-trece) mb-4 md:mb-10 mt-auto">
            <div class="flex items-center justify-between mb-5 md:mb-10">
                <div class="flex justify-start">
                    <div class="w-2 h-2 rounded-full bg-(--color-poniente) mt-[0.5rem] mr-2"></div>
                        <span class="font-titan font-bold md:text-fluid-body">3 horas</span>
                    </div>
                <p class="
                    font-titan
                    font-bold text-xl md:text-fluid-body">
                    150€<span class="text-(--color-trece) text-xs font-titan font-bold md:text-fluid-body">/persona</span>
                </p>
            </div>
            <a href="{% url 'contact' %}" class="
                font-titan
                font-bold
                text-white
                border
                bg-(--color-luz)
                rounded-xl
                p-5
                block
                w-fit
                mx-auto
                transition
                delay-100 
                duration-200 
                ease-in-out 
                hover:-translate-y-1 
                hover:scale-105

                md:text-fluid-body
                ">RESERVAR EXPERIENCIA
            </a>
        </div>
    </div>
</article>
